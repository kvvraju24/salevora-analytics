# Tells Python that src/salevora is a package, so `import salevora`
# works from tests, scripts and notebooks.
[project]
name = "salevora"
version = "0.1.0"
description = "Rossmann store sales analysis and forecasting"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
