name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      # GitHub has no MySQL database or Kaggle data, so those tests skip
      # themselves. The unit tests on made-up data (features, metrics,
      # baseline, leakage check) run on every push.
      - name: Run tests
        run: pytest -q -rs
